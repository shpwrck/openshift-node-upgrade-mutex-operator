name: Release

# Pushing a tag such as v0.3.0 publishes the operator, bundle and catalog
# images to ghcr.io and attaches the bundle to a GitHub release. Submitting
# the bundle to the community catalogs is a manual step; see
# docs/development.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Work out names
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openshift-node-upgrade-mutex-operator" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
          push: true
          tags: ${{ env.IMAGE_TAG_BASE }}:${{ env.VERSION }}
      - name: Build and push the bundle and catalog images
        run: |
          make bundle bundle-build bundle-push
          make catalog catalog-build catalog-push
      - name: Package the bundle
        run: tar czf bundle-${VERSION}.tar.gz bundle bundle.Dockerfile
      - uses: softprops/action-gh-release@v3
        with:
          files: bundle-${{ env.VERSION }}.tar.gz
          generate_release_notes: true
