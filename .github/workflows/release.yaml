---
# Publish a release when a tag v<MAJOR>.<MINOR>.<PATCH>[-<pre-release>] is
# pushed. `make release` builds and pushes the operator, bundle and catalog
# images to ghcr.io/<repository owner> with GITHUB_TOKEN, labelled with this
# repository, and adds the bundle to the catalog. The updated catalog template
# and rendered catalog are then pushed to the branch release/<tag>, for a pull
# request. A pre-release (for example v0.3.0-rc1) does not move the :latest
# tags. The version without its pre-release part must match .envrc.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      # contents: push the release/<tag> branch; packages: push to ghcr.io.
      contents: write
      packages: write
    env:
      CONTAINER_TOOL: podman
      USE_IMAGE_DIGESTS: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version and the registry
        run: |
          tag=$GITHUB_REF_NAME
          if ! [[ $tag =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $tag is not v<major>.<minor>.<patch>[-<pre-release>]"
            exit 1
          fi
          base=${BASH_REMATCH[1]}
          envrc=$(sed -n 's/^export MAJOR=//p' .envrc).$(sed -n 's/^export MINOR=//p' .envrc).$(sed -n 's/^export PATCH=//p' .envrc)
          if [ "$base" != "$envrc" ]; then
            echo "::error::tag $tag does not match the version in .envrc ($envrc)"
            exit 1
          fi
          {
            echo "VERSION=${tag#v}"
            echo "IMAGE_TAG_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openshift-node-upgrade-mutex-operator"
            echo "IMAGE_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          } >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # podman pushes the images; operator-sdk and opm read the docker login.
          printf '%s' "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Release
        run: make release

      - name: Push the catalog update
        run: |
          branch=release/$GITHUB_REF_NAME
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add catalog-template.yaml catalog/
          git commit -m "catalog: add $VERSION"
          git push origin "$branch"
          {
            echo "Released $VERSION to $IMAGE_TAG_BASE (-bundle, -catalog)."
            echo "Open a pull request from \`$branch\` to commit the catalog update:"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$branch"
          } >> "$GITHUB_STEP_SUMMARY"
