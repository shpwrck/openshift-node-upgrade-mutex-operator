---
# Lint, build and validate on every pull request and on pushes to main.
# Nothing is pushed and no secrets are used.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local image names only: CI builds images but never pushes them.
  IMAGE_TAG_BASE: localhost/openshift-node-upgrade-mutex-operator
  CONTAINER_TOOL: podman

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install linters
        # ansible-core matches the ansible-operator v1.42.3 base image;
        run: >-
          python -m pip install --no-cache-dir
          yamllint==1.38.0 ansible-core==2.18.18 ansible-lint==26.9.0

      - name: yamllint and ansible-lint
        run: make lint

      - name: shellcheck
        run: shellcheck hack/*.sh

      - name: Diagrams match their .mmd sources
        # Checks the source-hash stamp in each SVG: no podman, no rendering.
        run: make diagrams-check

      - name: Docs links, anchors and the console-safe docs/USAGE.md
        run: make docs-lint

  build:
    name: Build and validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: README.md and the CSV description are generated from docs/
        run: make document-check

      - name: Build the operator image
        run: make docker-build

      - name: Smoke-test the operator image
        run: make image-smoke-test

      - name: Generate and validate the bundle
        run: make bundle bundle-validate

      - name: Check the manifests and the generated CSV
        run: make verify-manifests

      - name: Build the bundle image
        run: make bundle-build

      - name: Validate the catalog
        run: make catalog-validate

      - name: Build the catalog image
        run: make catalog-build
