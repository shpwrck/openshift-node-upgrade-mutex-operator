---
- name: Build and load the operator image
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Pick the kind node provider
      ansible.builtin.include_tasks: tasks/kind_env.yml

    # The Dockerfile only pulls public images (quay.io/operator-framework)
    # and galaxy collections, so no registry login is needed.
    - name: Build the operator image
      ansible.builtin.command:
        argv:
          - "{{ container_tool }}"
          - build
          - --tag
          - "{{ operator_image }}"
          - --file
          - "{{ project_dir }}/Dockerfile"
          - "{{ project_dir }}"
      when: operator_build | bool
      changed_when: true

    # 'kind load docker-image' only works with docker; an archive works with
    # every builder and node provider.
    - name: Save the operator image
      ansible.builtin.command:
        argv:
          - "{{ container_tool }}"
          - save
          - --output
          - "{{ image_archive }}"
          - "{{ operator_image }}"
      changed_when: true

    - name: Load the operator image into the kind nodes
      ansible.builtin.command:
        argv:
          - "{{ kind }}"
          - load
          - image-archive
          - "{{ image_archive }}"
          - --name
          - "{{ kind_cluster_name }}"
      environment: "{{ e2e_kind_env }}"
      changed_when: true

- name: Deploy the operator
  ansible.builtin.import_playbook: ../default/converge.yml
