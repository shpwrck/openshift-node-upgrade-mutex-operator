---
- name: Prepare
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/e2e.yml

  tasks:
    - name: Ensure the operator image is set
      ansible.builtin.fail:
        msg: >-
          Set OPERATOR_IMAGE to the operator image to test (the 'kind' scenario
          builds one itself).
      when: not operator_image

    - name: Check that kustomize runs
      ansible.builtin.command:
        argv:
          - "{{ kustomize }}"
          - version
      changed_when: false

    - name: Refuse to run where OLM manages the operator
      ansible.builtin.include_tasks: tasks/olm_guard.yml
