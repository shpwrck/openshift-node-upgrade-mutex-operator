---
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/e2e.yml

  tasks:
    - name: Refuse to run where OLM manages the operator
      ansible.builtin.include_tasks: tasks/olm_guard.yml

    # First, while the operator still runs, so it can run the finalizers.
    - name: Remove the test CRs
      ansible.builtin.include_tasks: tasks/cleanup.yml

    - name: Render the test overlay
      ansible.builtin.include_tasks: tasks/overlay.yml

    - name: Delete the operator manifests
      kubernetes.core.k8s:
        definition: "{{ item }}"
        state: absent
        wait: true
      loop: "{{ e2e_overlay_resources | reverse | list }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name }}"

    - name: Delete the test namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ e2e_namespace }}"
        state: absent
        wait: true
        wait_timeout: "{{ e2e_timeout }}"
