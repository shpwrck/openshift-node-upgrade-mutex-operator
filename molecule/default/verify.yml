---
# End-to-end checks of the deployed operator. The CRs come from
# config/samples and are created in the operator's namespace, as the
# namespace boundary requires.
#
# Everywhere (also on a real OpenShift cluster):
#   preflight, MutexRule (dry-run validation), MutexTarget (status.nodes),
#   MutexRunConfig with no upgrade pending (only when that cannot start a
#   run), namespace boundary.
# Fake OpenShift only (kind scenario, e2e_fake_openshift):
#   a full simulated upgrade, then the finalizer, including deletion in the
#   middle of a run.
- name: Verify
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/e2e.yml
  vars:
    e2e_sample_rule: "{{ lookup('ansible.builtin.file', samples_dir ~ '/nodeupgrade_v1alpha1_mutexrule.yaml') | from_yaml }}"
    e2e_owner: "{{ e2e_namespace }}/{{ e2e_runconfig_name }}"
    e2e_release_value: "{{ e2e_owner | hash('sha1') }}"
    e2e_rule_label: "{{ e2e_label_prefix }}{{ e2e_rule_name }}.{{ e2e_namespace }}"

  tasks:
    - name: Run the tests
      block:
        - name: Remove test CRs left by an earlier run
          ansible.builtin.include_tasks: tasks/cleanup.yml

        - name: Reset the fake OpenShift state
          ansible.builtin.include_tasks: tasks/fake_reset.yml
          when: e2e_fake_openshift | bool

        - name: Preflight
          ansible.builtin.include_tasks: tasks/preflight.yml

        - name: MutexRule
          ansible.builtin.include_tasks: tasks/mutexrule_test.yml

        - name: MutexTarget
          ansible.builtin.include_tasks: tasks/mutextarget_test.yml

        - name: MutexRunConfig without an upgrade
          ansible.builtin.include_tasks: tasks/mutexrunconfig_test.yml

        - name: Namespace boundary
          ansible.builtin.include_tasks: tasks/namespace_test.yml

        - name: Simulated upgrade
          ansible.builtin.include_tasks: tasks/upgrade_test.yml
          when: e2e_fake_openshift | bool

        - name: Finalizer
          ansible.builtin.include_tasks: tasks/finalizer_test.yml
          when: e2e_fake_openshift | bool

        - name: Remove the test CRs
          ansible.builtin.include_tasks: tasks/cleanup.yml

      rescue:
        - name: Show the cluster state
          ansible.builtin.include_tasks: tasks/debug.yml

        - name: Re-raise the failure
          ansible.builtin.fail:
            msg: "{{ ansible_failed_task.name | default('verify') }}: {{ ansible_failed_result.msg | default(ansible_failed_result) }}"
