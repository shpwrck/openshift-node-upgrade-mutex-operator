---
# Test parameters shared by every molecule playbook. Scenario-specific
# settings (cluster, image, e2e_fake_openshift) live in each molecule.yml.

e2e_api_version: nodeupgrade.redhat-na-ssa.github.io/v1alpha1

# The CRs come from config/samples (the same files feed the CSV alm-examples).
e2e_rule_name: mutexrule-sample
e2e_target_name: mutextarget-sample
e2e_runconfig_name: mutexrunconfig-sample
e2e_canary_pool: canary
e2e_target_pool: worker

# Upper bound in seconds for any single wait (Job runs include image pulls).
e2e_timeout: 300
# Reconcile period set on the test MutexRunConfigs with the
# ansible.sdk.operatorframework.io/reconcile-period annotation, so the
# operator notices a ClusterVersion change within seconds instead of the 10
# minutes in watches.yaml. ClusterVersion is not watched by the operator.
e2e_reconcile_period: 15s

# Names the operator uses on nodes, pools and Jobs (see roles/mutexrunconfig).
e2e_label_prefix: mutexrule.nodeupgrade.redhat-na-ssa.github.io/
# Release label: its value is the SHA-1 of '<namespace>/<name>' of the
# MutexRunConfig. During a run the canary selects only nodes carrying it with
# that value and the target pool only nodes without it.
e2e_release_label: "{{ e2e_label_prefix }}release"
e2e_version_label: machineconfiguration.openshift.io/release-image-version
e2e_annotation_paused_by: nodeupgrade.redhat-na-ssa.github.io/paused-by
e2e_annotation_original_expressions: nodeupgrade.redhat-na-ssa.github.io/original-match-expressions
e2e_annotation_prefix: nodeupgrade.redhat-na-ssa.github.io/
# Node annotations of the Machine Config Operator, which the fake MCO sets
# (fake_reset.yml, upgrade_node.yml) and the operator reads.
e2e_mco_state: machineconfiguration.openshift.io/state
e2e_mco_current_config: machineconfiguration.openshift.io/currentConfig
e2e_mco_desired_config: machineconfiguration.openshift.io/desiredConfig
e2e_finalizer: nodeupgrade.redhat-na-ssa.github.io/finalizer

# RFC 3339 UTC timestamps written by the roles.
e2e_time_regex: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'

# Fake OpenShift (kind scenario only): versions the fake ClusterVersion and
# the nodes' release-image-version labels move through.
e2e_from_version: "4.16.4"
e2e_to_version: "4.16.5"
e2e_abort_version: "4.16.6"
# Rendered configs the fake MCO reports: rendered-<pool>-<hash> as current
# and desired config of a node that is not updating, and the canary's as the
# config of a node released into the canary.
e2e_rendered_config_hash: "0e2e1234"
e2e_canary_rendered_config: "rendered-{{ e2e_canary_pool }}-0e2e5678"
# The canary pool from the README.
e2e_canary_expressions:
  - key: isCanary
    operator: Exists
