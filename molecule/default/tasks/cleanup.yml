---
# Deletes every MutexRunConfig, MutexRule and MutexTarget in the test
# namespace. MutexRunConfigs go first and one at a time, so the operator runs
# each finalizer (unpause, unlabel, restore selectors) while it is still
# deployed. A MutexRunConfig still there after e2e_timeout (the operator did
# not finalize it, for example because it is not running) has its finalizer
# removed, so cleanup and the CRD deletion in destroy do not hang; nothing is
# restored for it then. Last, the Jobs the operator started in the test
# namespace are deleted, so verify can run again on the same cluster.
- name: List the MutexRunConfigs left in the test namespace
  kubernetes.core.k8s_info:
    api_version: "{{ e2e_api_version }}"
    kind: MutexRunConfig
    namespace: "{{ e2e_namespace }}"
  register: e2e_left_runconfigs
  failed_when: false

- name: Delete the MutexRunConfigs and wait for their finalizers
  kubernetes.core.k8s:
    api_version: "{{ e2e_api_version }}"
    kind: MutexRunConfig
    name: "{{ item.metadata.name }}"
    namespace: "{{ e2e_namespace }}"
    state: absent
    wait: true
    wait_timeout: "{{ e2e_timeout }}"
  loop: "{{ e2e_left_runconfigs.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  failed_when: false

# Read them again rather than relying on each deletion's result: a timed-out
# wait is not reported as failed under failed_when: false.
- name: List the MutexRunConfigs that were not finalized
  kubernetes.core.k8s_info:
    api_version: "{{ e2e_api_version }}"
    kind: MutexRunConfig
    namespace: "{{ e2e_namespace }}"
  register: e2e_unfinalized_runconfigs
  failed_when: false
  when: e2e_left_runconfigs.resources | default([]) | length > 0

- name: Remove the finalizer from MutexRunConfigs that were not finalized
  kubernetes.core.k8s:
    api_version: "{{ e2e_api_version }}"
    kind: MutexRunConfig
    name: "{{ item.metadata.name }}"
    namespace: "{{ e2e_namespace }}"
    state: patched
    definition:
      metadata:
        finalizers: []
  loop: "{{ e2e_unfinalized_runconfigs.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  failed_when: false

- name: Delete the MutexRules and MutexTargets
  kubernetes.core.k8s:
    api_version: "{{ e2e_api_version }}"
    kind: "{{ item }}"
    namespace: "{{ e2e_namespace }}"
    delete_all: true
    state: absent
    wait: true
  loop:
    - MutexRule
    - MutexTarget
  failed_when: false

# The operator's Jobs have no owner and no TTL, so they outlive the
# MutexRunConfigs. A re-run would see them in the dry-run and early-cleanup
# checks, and the operator would reuse the Complete ones (same job-key).
- name: Delete the Jobs the operator started in the test namespace
  kubernetes.core.k8s:
    api_version: batch/v1
    kind: Job
    namespace: "{{ e2e_namespace }}"
    label_selectors:
      - openshift-optional.skrzypek.io/job-key
    delete_all: true
    state: absent
    delete_options:
      propagationPolicy: Background
    wait: true
  failed_when: false
