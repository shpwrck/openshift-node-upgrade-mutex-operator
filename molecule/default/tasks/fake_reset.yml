---
# Fake OpenShift only (kind scenario): puts the fake MCO state back to "every
# node runs e2e_from_version, nothing is upgrading", so verify can run again
# on the same cluster. Run it only after cleanup.yml removed the test CRs.
#   - control-plane nodes: node-role.kubernetes.io/master, workers:
#     node-role.kubernetes.io/worker (as on OpenShift), all with the
#     release-image-version label NFD would publish, and no mutex label;
#   - the MCO annotations of a node that is not updating: currentConfig and
#     desiredConfig rendered-<master|worker>-<hash> and state Done, and no
#     openshift-optional.skrzypek.io/ annotation;
#   - MachineConfigPools 'master', 'worker' and the README's 'canary',
#     recreated so no annotation or selector change survives;
#   - ClusterVersion 'version' at a completed e2e_from_version.
- name: List the nodes
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: e2e_fake_nodes

- name: Label and annotate the nodes like OpenShift nodes running {{ e2e_from_version }}
  kubernetes.core.k8s:
    api_version: v1
    kind: Node
    name: "{{ item.metadata.name }}"
    state: patched
    definition:
      metadata:
        labels: >-
          {{ dict(item.metadata.labels | default({}, true) | dict2items | map(attribute='key')
                  | select('match', e2e_label_prefix | regex_escape) | product([none]))
             | combine({e2e_version_label: e2e_from_version})
             | combine({'node-role.kubernetes.io/master': ''} if e2e_control_plane else {'node-role.kubernetes.io/worker': ''}) }}
        annotations: >-
          {{ dict(item.metadata.annotations | default({}, true) | dict2items | map(attribute='key')
                  | select('match', e2e_annotation_prefix | regex_escape) | product([none]))
             | combine({e2e_mco_state: 'Done', e2e_mco_current_config: e2e_rendered_config,
                        e2e_mco_desired_config: e2e_rendered_config}) }}
  loop: "{{ e2e_fake_nodes.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  vars:
    e2e_control_plane: "{{ 'node-role.kubernetes.io/control-plane' in (item.metadata.labels | default({}, true)) }}"
    e2e_rendered_config: "rendered-{{ 'master' if e2e_control_plane else 'worker' }}-{{ e2e_rendered_config_hash }}"

- name: Remove the fake MachineConfigPools
  kubernetes.core.k8s:
    api_version: machineconfiguration.openshift.io/v1
    kind: MachineConfigPool
    name: "{{ item }}"
    state: absent
    wait: true
  loop:
    - master
    - worker
    - "{{ e2e_canary_pool }}"

- name: Create the fake MachineConfigPools
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: machineconfiguration.openshift.io/v1
      kind: MachineConfigPool
      metadata:
        name: "{{ item.name }}"
      spec:
        machineConfigSelector:
          matchLabels:
            machineconfiguration.openshift.io/role: "{{ item.role }}"
        nodeSelector: "{{ item.nodeSelector }}"
        paused: false
  loop:
    - name: master
      role: master
      nodeSelector:
        matchLabels:
          node-role.kubernetes.io/master: ""
    - name: worker
      role: worker
      nodeSelector:
        matchLabels:
          node-role.kubernetes.io/worker: ""
    # The canary pool from the README.
    - name: "{{ e2e_canary_pool }}"
      role: worker
      nodeSelector:
        matchLabels:
          node-role.kubernetes.io/worker: ""
        matchExpressions: "{{ e2e_canary_expressions }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set the fake ClusterVersion
  ansible.builtin.include_tasks: cluster_version.yml
  vars:
    e2e_cv_version: "{{ e2e_from_version }}"
    e2e_cv_previous: ""
