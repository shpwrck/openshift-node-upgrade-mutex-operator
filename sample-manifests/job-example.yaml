# A MutexRule whose Jobs act on the node being upgraded: before the upgrade
# the Job labels the node, after it the cleanup Job removes the label again.
#
# Job contract: the operator adds NODE_NAME (the node being upgraded) and
# MUTEX_RULE (this MutexRule's name) to every container's env, so the
# commands use $(NODE_NAME) instead of a hard-coded node. It also keeps the
# pod off that node. See config/samples for the other fields.
#
# The Jobs run as a dedicated ServiceAccount that may only read and patch
# nodes. Do not grant node access to the 'default' ServiceAccount: every pod
# in the namespace that sets no serviceAccountName would get it.
#
# Everything is created in the operator's namespace (MutexRules are only
# reconciled there); replace node-upgrade-mutex-operator if you installed
# the operator elsewhere. The image is the OpenShift CLI; on a cluster with
# the internal registry you can use the 'cli' image stream instead
# (image-registry.openshift-image-registry.svc:5000/openshift/cli:latest),
# which always matches the cluster version.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mutex-node-labeler
  namespace: node-upgrade-mutex-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mutex-node-labeler
rules:
  # 'oc label node' reads the node, then patches it.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mutex-node-labeler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mutex-node-labeler
subjects:
  - kind: ServiceAccount
    name: mutex-node-labeler
    namespace: node-upgrade-mutex-operator
---
apiVersion: nodeupgrade.redhat-na-ssa.github.io/v1alpha1
kind: MutexRule
metadata:
  name: label-node
  namespace: node-upgrade-mutex-operator
spec:
  type: kubernetes
  jobName: label-node
  timeoutSeconds: 300
  jobSpec:
    backoffLimit: 2
    template:
      spec:
        serviceAccountName: mutex-node-labeler
        restartPolicy: Never
        containers:
          - name: oc
            image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
            command:
              - oc
              - label
              - node
              - $(NODE_NAME)
              - example.com/pre-upgrade-done=true
              - --overwrite
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
  cleanUpJobSpec:
    backoffLimit: 2
    template:
      spec:
        serviceAccountName: mutex-node-labeler
        restartPolicy: Never
        containers:
          - name: oc
            image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
            command:
              - oc
              - label
              - node
              - $(NODE_NAME)
              - example.com/pre-upgrade-done-
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
