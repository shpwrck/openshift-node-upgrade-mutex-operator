# CatalogSource for the project's catalog image, which the release workflow
# publishes to ghcr.io. operator-install.yaml subscribes to it by name.
#
# Tags: :latest follows the newest final release and exists only after the
# first one; a pre-release has only its own tag, for example :v0.3.0-rc2.
# Before the project's first release there is no catalog image at all, so
# nothing can be installed from it. To see which tags exist:
#   skopeo list-tags docker://ghcr.io/redhat-na-ssa/openshift-node-upgrade-mutex-operator-catalog
#
# registryPoll makes OLM fetch the image again every 10 minutes, so a new
# version pushed to the same tag appears in the channel. That suits :latest
# on a test cluster. In production, use a :v<version> tag and change it on
# purpose when you want to offer a newer version; keep the Subscription on
# Manual approval either way.
#
# To use your own catalog instead (one you built with make release, or with
# make catalog-build catalog-push and CATALOG_IMG set, or a copy mirrored for
# a disconnected cluster), replace spec.image with that image.
#
# After applying it, this prints READY once OLM can read the catalog:
#   oc get catalogsource node-upgrade-mutex-operator-catalog -n openshift-marketplace -o jsonpath='{.status.connectionState.lastObservedState}'
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: node-upgrade-mutex-operator-catalog
  namespace: openshift-marketplace
spec:
  displayName: Node Upgrade Mutex Operator
  image: ghcr.io/redhat-na-ssa/openshift-node-upgrade-mutex-operator-catalog:latest
  sourceType: grpc
  updateStrategy:
    registryPoll:
      interval: 10m
