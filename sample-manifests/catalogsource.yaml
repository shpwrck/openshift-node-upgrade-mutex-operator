# CatalogSource for installing the operator from the project's catalog image,
# published by the release workflow. :latest follows the newest final release;
# to install a pre-release, use its tag instead (for example :v0.3.0-rc2). For
# a catalog you built yourself (make release, or make catalog-build
# catalog-push with CATALOG_IMG set), use that image.
# registryPoll makes OLM pick up new versions pushed to the same tag.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: node-upgrade-mutex-operator-catalog
  namespace: openshift-marketplace
spec:
  displayName: Node Upgrade Mutex Operator
  image: ghcr.io/redhat-na-ssa/openshift-node-upgrade-mutex-operator-catalog:latest
  sourceType: grpc
  updateStrategy:
    registryPoll:
      interval: 10m
