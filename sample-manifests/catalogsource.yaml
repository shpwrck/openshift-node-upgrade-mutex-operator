# CatalogSource for installing the operator from a catalog image you built
# and pushed yourself (make release, or make catalog-build catalog-push with
# CATALOG_IMG set). Replace the image with your registry and organization.
# registryPoll makes OLM pick up new versions pushed to the same tag.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: node-upgrade-mutex-operator-catalog
  namespace: openshift-marketplace
spec:
  displayName: Node Upgrade Mutex Operator
  image: example.com/openshift-node-upgrade-mutex-operator-catalog:latest
  sourceType: grpc
  updateStrategy:
    registryPoll:
      interval: 10m
