# Publishes each worker's release version as the node label
# machineconfiguration.openshift.io/release-image-version, which the operator
# compares with ClusterVersion status.desired.version. It needs the Node
# Feature Discovery operator with the NodeFeatureDiscovery in
# nodefeaturediscovery.yaml: a systemd timer runs the script below every
# minute, the script writes the version into NFD's features.d directory, and
# nfd-worker turns it into the label.
#
# The version comes from /etc/machine-config-daemon/currentconfig, the
# rendered MachineConfig that MCD expects the node to run. MCD writes that
# file before it reboots the node into the new config, so the script
# publishes the version only once the booted OS image is the one the config
# names (the same check MCD makes after the reboot). The check needs
# rpm-ostree, so it works on RHCOS nodes. When a release does not change the
# OS image, the image already matches before the reboot, and the label can
# change shortly before the node reboots.
#
# WARNING: applying (or changing) this MachineConfig rolls out to the whole
# worker pool: MCO drains and reboots every worker, as many at a time as the
# pool's maxUnavailable allows. New files and systemd units are not
# rebootless changes. Apply it in a maintenance window, before using the
# operator. It keeps the name of the earlier sample, so applying it replaces
# that one.
#
# The data: URL below is this script, base64-encoded, installed as
# /usr/local/bin/release-image-version-feature.sh:
#
#   #!/bin/bash
#   # Publishes the release version of the rendered MachineConfig this node has
#   # booted into as a Node Feature Discovery local feature, so nfd-worker labels
#   # the node machineconfiguration.openshift.io/release-image-version=<version>.
#   #
#   # MCD writes currentconfig (and, with on-cluster layering, currentimage)
#   # before it reboots the node into that config, so the file alone does not
#   # show that the node runs it. The version is published only when the booted
#   # OS image is the one these files name, compared as MCD compares them after
#   # the reboot. Otherwise, or when something cannot be read, the feature file
#   # is left as it is. Reads the annotation by name (not by position), so extra
#   # annotations such as os-image-url-overridden do not change the result.
#   set -euo pipefail
#
#   key=machineconfiguration.openshift.io/release-image-version
#   config=/etc/machine-config-daemon/currentconfig
#   image_file=/etc/machine-config-daemon/currentimage
#   dir=/etc/kubernetes/node-feature-discovery/features.d
#   file="$dir/release-image-version"
#   # Written by the earlier version of this sample, which could publish a wrong
#   # or stale value; remove it so only this file sets the label.
#   legacy="$dir/node-version"
#
#   skip() {
#     echo "$*; leaving $file unchanged" >&2
#     exit 0
#   }
#
#   # Prints the image of an rpm-ostree container-image-reference without its
#   # ostree scheme, remote and transport, as MCD does: for example
#   # ostree-unverified-registry:quay.io/x@sha256:... gives quay.io/x@sha256:...
#   image_of() {
#     local scheme=${1%%:*} rest=${1#*:} transport
#     case $scheme in
#       ostree-remote-registry | ostree-remote-image) rest=${rest#*:} ;;
#     esac
#     case $scheme in
#       ostree-unverified-registry | ostree-remote-registry) ;;
#       ostree-image-signed | ostree-unverified-image | ostree-remote-image)
#         transport=${rest%%:*}
#         rest=${rest#*:}
#         if [ "$transport" = docker ]; then
#           rest=${rest#//}
#         fi
#         ;;
#       *) return 1 ;;
#     esac
#     printf '%s\n' "$rest"
#   }
#
#   version=$(jq -r --arg key "$key" '.metadata.annotations[$key] // empty' "$config") ||
#     skip "cannot read $config"
#   [ -n "$version" ] || skip "$config has no $key annotation"
#
#   # The image MCD checks the booted OS against: currentimage when it is set,
#   # else the config's osImageURL.
#   expected=
#   if [ -s "$image_file" ]; then
#     expected=$(tr -d '[:space:]' <"$image_file") || skip "cannot read $image_file"
#   fi
#   if [ -z "$expected" ]; then
#     expected=$(jq -r '.spec.osImageURL // empty' "$config") || skip "cannot read $config"
#   fi
#   [ -n "$expected" ] || skip "$config has no spec.osImageURL"
#
#   ref=$(rpm-ostree status --json |
#     jq -r 'first(.deployments[] | select(.booted == true)) | .["container-image-reference"] // empty') ||
#     skip "cannot read the booted deployment from rpm-ostree status"
#   [ -n "$ref" ] || skip "the booted deployment has no container-image-reference"
#   booted=$(image_of "$ref") || skip "cannot parse the booted image reference $ref"
#   [ "$booted" = "$expected" ] ||
#     skip "the booted OS image $booted is not $expected (release $version)"
#
#   rm -f "$legacy"
#
#   line="$key=$version"
#   if [ "$(cat "$file" 2>/dev/null || true)" != "$line" ]; then
#     mkdir -p "$dir"
#     printf '%s\n' "$line" > "$file.tmp"
#     mv -f "$file.tmp" "$file"
#   fi
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 00-release-image-version
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /usr/local/bin/release-image-version-feature.sh
          mode: 493
          overwrite: true
          contents:
            # yamllint disable-line rule:line-length
            source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
        - name: release-image-version-feature.service
          contents: |
            [Unit]
            Description=Publish the release-image-version node feature for NFD

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/release-image-version-feature.sh
        - name: release-image-version-feature.timer
          enabled: true
          contents: |
            [Unit]
            Description=Refresh the release-image-version node feature every minute

            [Timer]
            OnBootSec=30s
            OnUnitActiveSec=60s

            [Install]
            WantedBy=timers.target
