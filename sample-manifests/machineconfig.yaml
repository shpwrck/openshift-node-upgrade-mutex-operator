# Publishes each worker's release version as the node label
# machineconfiguration.openshift.io/release-image-version, which the operator
# compares with ClusterVersion status.desired.version. It needs the Node
# Feature Discovery operator with the NodeFeatureDiscovery in
# nodefeaturediscovery.yaml: a systemd timer runs the script below every
# minute and writes the version of the node's current rendered MachineConfig
# into NFD's features.d directory, and nfd-worker turns it into the label.
#
# WARNING: applying (or changing) this MachineConfig rolls out to the whole
# worker pool: MCO drains and reboots every worker, as many at a time as the
# pool's maxUnavailable allows. New files and systemd units are not
# rebootless changes. Apply it in a maintenance window, before using the
# operator. It keeps the name of the earlier sample, so applying it replaces
# that one.
#
# The data: URL below is this script, base64-encoded, installed as
# /usr/local/bin/release-image-version-feature.sh:
#
#   #!/bin/bash
#   # Publishes the release version of this node's current rendered MachineConfig
#   # as a Node Feature Discovery local feature, so nfd-worker labels the node
#   # machineconfiguration.openshift.io/release-image-version=<version>.
#   # Reads the annotation by name (not by position), so extra annotations such
#   # as os-image-url-overridden do not change the result.
#   set -euo pipefail
#
#   key=machineconfiguration.openshift.io/release-image-version
#   config=/etc/machine-config-daemon/currentconfig
#   dir=/etc/kubernetes/node-feature-discovery/features.d
#   file="$dir/release-image-version"
#   # Written by the earlier version of this sample, which could publish a wrong
#   # or stale value; remove it so only this file sets the label.
#   legacy="$dir/node-version"
#
#   version=$(jq -r --arg key "$key" '.metadata.annotations[$key] // empty' "$config")
#   if [ -z "$version" ]; then
#     echo "$config has no $key annotation; leaving $file unchanged" >&2
#     exit 0
#   fi
#
#   rm -f "$legacy"
#
#   line="$key=$version"
#   if [ "$(cat "$file" 2>/dev/null || true)" != "$line" ]; then
#     mkdir -p "$dir"
#     printf '%s\n' "$line" > "$file.tmp"
#     mv -f "$file.tmp" "$file"
#   fi
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 00-release-image-version
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /usr/local/bin/release-image-version-feature.sh
          mode: 493
          overwrite: true
          contents:
            # yamllint disable-line rule:line-length
            source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
        - name: release-image-version-feature.service
          contents: |
            [Unit]
            Description=Publish the release-image-version node feature for NFD

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/release-image-version-feature.sh
        - name: release-image-version-feature.timer
          enabled: true
          contents: |
            [Unit]
            Description=Refresh the release-image-version node feature every minute

            [Timer]
            OnBootSec=30s
            OnUnitActiveSec=60s

            [Install]
            WantedBy=timers.target
