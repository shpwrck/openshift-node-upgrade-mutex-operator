# If the cluster already has a NodeFeatureDiscovery, do not apply this file:
# it would replace that instance's worker configuration. Keep the existing
# instance and only make sure that its workerConfig sets no
# core.labelSources, or lists local (or all) there.
#
# NodeFeatureDiscovery instance for the Node Feature Discovery operator
# (install it from OperatorHub into openshift-nfd first). nfd-worker reads the
# feature file that machineconfig.yaml writes to
# /etc/kubernetes/node-feature-discovery/features.d/ and labels each node with
# machineconfiguration.openshift.io/release-image-version. That needs the
# local feature source, which NFD enables by default, and no hooks: the
# MachineConfig's timer writes the file, nothing is run from nfd-worker.
#
# operand.image is left out on purpose, so the NFD operator deploys the
# operand that matches its own version (pinning one digest would keep the
# same operand across OpenShift upgrades). To pin it anyway, use the tag of
# your OpenShift minor version, for example
# registry.redhat.io/openshift4/ose-node-feature-discovery-rhel9:v4.16.
apiVersion: nfd.openshift.io/v1
kind: NodeFeatureDiscovery
metadata:
  name: nfd-instance
  namespace: openshift-nfd
spec:
  operand:
    imagePullPolicy: IfNotPresent
  workerConfig:
    # No core.labelSources: the default (all) includes local and keeps the
    # labels of every other source.
    configData: |
      core:
        sleepInterval: 60s
