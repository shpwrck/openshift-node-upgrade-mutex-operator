# Minimal stand-ins for the OpenShift APIs the operator reads, so the
# end-to-end test runs on plain Kubernetes (kind).
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterversions.config.openshift.io
  annotations:
    e2e.nodeupgrade.redhat-na-ssa.github.io/stub: "true"
spec:
  group: config.openshift.io
  scope: Cluster
  names:
    kind: ClusterVersion
    listKind: ClusterVersionList
    plural: clusterversions
    singular: clusterversion
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
