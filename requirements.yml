---
# Collections installed into the operator image (see Dockerfile).
# Keep this list to what roles/ actually uses:
#   operator_sdk.util  - k8s_status
#   kubernetes.core    - k8s, k8s_info
# The python libraries these need (kubernetes, PyYAML, jinja2) ship in the
# ansible-operator base image. All pins support ansible-core 2.18
# (ansible-operator v1.42.3 base image).
collections:
  - name: operator_sdk.util
    version: "0.5.0"
  - name: kubernetes.core
    version: "6.6.0"
