---
# Puts the cluster back the way it was before the run. Used at the end of a
# run and by the finalizer when the MutexRunConfig is deleted.
# Inputs: mutexrunconfig_restore_pools, the canary and target pool names, and
# mutexrunconfig_restore_nodes, the target nodes (empty when no MutexTarget
# is left).
#   1. every pool with an original-match-expressions annotation whose
#      modified-by annotation names this MutexRunConfig gets its saved
#      matchExpressions back and loses both annotations. This covers a pool
#      whose MutexTarget is gone and a pool an administrator paused. A pool
#      changed before modified-by existed (no modified-by) is restored when it
#      is in mutexrunconfig_restore_pools or paused by this MutexRunConfig;
#      a pool modified by another MutexRunConfig is never touched. On the
#      canary, an expression added to its live matchExpressions during the run
#      (not on a mutex label key, and not in the saved list) is kept, as 01
#      does. An empty list removes matchExpressions, because a pool without
#      the key (the usual case) is saved as []. The canary, and any pool that
#      still carries an 'In' expression on the release label (a canary of
#      this MutexRunConfig under an earlier name), is restored last. Until
#      then a released node still matches the canary, and once its own pool
#      is restored it matches both; MCO leaves it where it is (it refuses a
#      node of two custom pools, and the canary wins over 'worker'). Restoring
#      the canary first would leave a released node of a custom target pool
#      in neither pool, so it would fall into 'worker', unpaused when 'worker'
#      is not a target;
#   2. this run's mutex labels are removed from the nodes whose labelled-by
#      annotation names this MutexRunConfig and from nodes without any
#      labelled-by (labelled before it existed) that are target nodes or,
#      when no MutexTarget is left, any node. A node whose labelled-by names
#      another MutexRunConfig keeps its labels, also when it is a target node,
#      so deleting a MutexRunConfig that shares a MutexRule or a pool with
#      another one leaves that one's held nodes in its paused pool. A node
#      whose labelled-by names this MutexRunConfig loses every mutex label,
#      also that of a MutexRule removed from spec.mutexRules during the run.
#      This MutexRunConfig's labelled-by and released-by annotations are
#      removed from every node, and so is the release label where it carries
#      this MutexRunConfig's value (released nodes and the canary's own
#      nodes); another MutexRunConfig's value is never removed. At the end of
#      a run (not in the finalizer) the release label stays on every node in
#      a pass that restores a selector, and a later pass that finds no
#      selector to restore removes it: the next reconcile, because Finish Run
#      also runs when no target node is behind. Once the canary is restored no
#      pool selects on the label, so it does no harm there, and an MCO view of
#      the pools that still has the run-time canary keeps the canary's own
#      nodes in it. The finalizer has a single pass: it removes the label
#      right after the restore, so an MCO view of the pools that lags the
#      canary's restore at that moment can move a canary node through
#      'worker' once;
#   3. every pool whose paused-by annotation names this MutexRunConfig is
#      unpaused and loses the annotation. Pools paused by someone else are
#      never unpaused.
# Selectors are restored before the node labels are removed and before
# unpausing, so the canary's own nodes match the restored canary before they
# lose the release label, a node released in the middle of its update moves
# to its paused pool (its MCO daemon finishes the update there), and the nodes
# are back in their own pools when MCO resumes.
- name: List MachineConfigPools
  kubernetes.core.k8s_info:
    api_version: "machineconfiguration.openshift.io/v1"
    kind: MachineConfigPool
  register: mutexrunconfig_all_pools

- name: Reset Restore Facts
  ansible.builtin.set_fact:
    mutexrunconfig_unpause_pools: []
    mutexrunconfig_selector_pools_first: []
    mutexrunconfig_selector_pools_last: []

- name: Select Pools To Restore
  ansible.builtin.set_fact:
    mutexrunconfig_unpause_pools: >-
      {{ mutexrunconfig_unpause_pools + ([item.metadata.name] if mutexrunconfig_paused_by_us | bool else []) }}
    mutexrunconfig_selector_pools_first: >-
      {{ mutexrunconfig_selector_pools_first
         + ([item] if mutexrunconfig_restore_selector | bool and not mutexrunconfig_pool_is_canary | bool else []) }}
    mutexrunconfig_selector_pools_last: >-
      {{ mutexrunconfig_selector_pools_last
         + ([item] if mutexrunconfig_restore_selector | bool and mutexrunconfig_pool_is_canary | bool else []) }}
  loop: "{{ mutexrunconfig_all_pools.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  vars:
    mutexrunconfig_pool_annotations: "{{ item.metadata.annotations | default({}, true) }}"
    mutexrunconfig_modified_by: "{{ mutexrunconfig_pool_annotations[mutexrunconfig_annotation_modified_by] | default('') }}"
    mutexrunconfig_paused_by_us: >-
      {{ (mutexrunconfig_pool_annotations[mutexrunconfig_annotation_paused_by] | default('')) == mutexrunconfig_owner }}
    mutexrunconfig_restore_selector: >-
      {{ mutexrunconfig_pool_annotations[mutexrunconfig_annotation_original_expressions] is defined
         and (mutexrunconfig_modified_by == mutexrunconfig_owner
              or (mutexrunconfig_modified_by | length == 0
                  and (item.metadata.name in mutexrunconfig_restore_pools or mutexrunconfig_paused_by_us | bool))) }}
    mutexrunconfig_pool_is_canary: >-
      {{ item.metadata.name == mutexrunconfig_canary_name
         or (item.spec.nodeSelector.matchExpressions | default([], true) | selectattr('key', 'equalto', mutexrunconfig_release_label)
             | selectattr('operator', 'equalto', 'In') | list | length > 0) }}

- name: Decide Whether To Remove The Release Labels Now
  ansible.builtin.set_fact:
    mutexrunconfig_keep_release_labels: >-
      {{ not mutexrunconfig_finalizing | bool
         and (mutexrunconfig_selector_pools_first + mutexrunconfig_selector_pools_last) | length > 0 }}

- name: Restore Pool Node Selectors
  kubernetes.core.k8s:
    state: patched
    merge_type: merge
    api_version: "machineconfiguration.openshift.io/v1"
    kind: MachineConfigPool
    name: "{{ item.metadata.name }}"
    definition:
      metadata:
        annotations:
          openshift-optional.skrzypek.io/original-match-expressions: null
          openshift-optional.skrzypek.io/modified-by: null
      spec:
        nodeSelector: "{{ {'matchExpressions': mutexrunconfig_restored_expressions if mutexrunconfig_restored_expressions | length > 0 else none} }}"
  vars:
    mutexrunconfig_saved_expressions: "{{ item.metadata.annotations[mutexrunconfig_annotation_original_expressions] | from_json }}"
    mutexrunconfig_added_expressions: >-
      {{ (item.spec.nodeSelector.matchExpressions | default([], true)
          | rejectattr('key', 'match', mutexrunconfig_label_prefix | regex_escape)
          | reject('in', mutexrunconfig_saved_expressions) | list)
         if item.metadata.name == mutexrunconfig_canary_name else [] }}
    mutexrunconfig_restored_expressions: "{{ mutexrunconfig_saved_expressions + mutexrunconfig_added_expressions }}"
  loop: "{{ mutexrunconfig_selector_pools_first + mutexrunconfig_selector_pools_last }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: List Nodes
  kubernetes.core.k8s_info:
    api_version: "v1"
    kind: Node
  register: mutexrunconfig_restore_node_info

# For each node: the mutex labels to remove, the release label when it
# carries this MutexRunConfig's value (not in a pass that keeps it, see
# above), and the annotations of this MutexRunConfig to remove. Nodes with
# nothing to change are left out.
- name: Select Nodes To Restore
  ansible.builtin.set_fact:
    mutexrunconfig_restore_node_patches: >-
      {%- set ns = namespace(patches=[]) -%}
      {%- for node in mutexrunconfig_restore_node_info.resources -%}
      {%- set labels = node.metadata.labels | default({}, true) -%}
      {%- set annotations = node.metadata.annotations | default({}, true) -%}
      {%- set held_by_us = annotations[mutexrunconfig_annotation_labelled_by] | default('') == mutexrunconfig_owner -%}
      {%- set released_by_us = (annotations[mutexrunconfig_annotation_released_by] | default('')).startswith(mutexrunconfig_owner ~ '|') -%}
      {%- set release_ours = labels[mutexrunconfig_release_label] | default('') == mutexrunconfig_release_value -%}
      {%- set has_labels = mutexrunconfig_remove_labels.keys() | select('in', labels) | list | length > 0 -%}
      {%- set unmarked = annotations[mutexrunconfig_annotation_labelled_by] is not defined -%}
      {%- set unlabel = has_labels and (held_by_us
                                       or (unmarked and (node.metadata.name in mutexrunconfig_restore_nodes
                                                         or mutexrunconfig_restore_nodes | length == 0))) -%}
      {%- set node_ns = namespace(drop=(mutexrunconfig_remove_labels if unlabel else {})) -%}
      {%- if held_by_us -%}
      {%- for key in labels.keys() if key.startswith(mutexrunconfig_label_prefix) and key != mutexrunconfig_release_label -%}
      {%- set node_ns.drop = node_ns.drop | combine({key: none}) -%}
      {%- endfor -%}
      {%- endif -%}
      {%- if release_ours and not mutexrunconfig_keep_release_labels | bool -%}
      {%- set node_ns.drop = node_ns.drop | combine({mutexrunconfig_release_label: none}) -%}
      {%- endif -%}
      {%- set unmark = {} -%}
      {%- if held_by_us -%}{%- set unmark = unmark | combine({mutexrunconfig_annotation_labelled_by: none}) -%}{%- endif -%}
      {%- if released_by_us -%}{%- set unmark = unmark | combine({mutexrunconfig_annotation_released_by: none}) -%}{%- endif -%}
      {%- if node_ns.drop | length > 0 or unmark | length > 0 -%}
      {%- set ns.patches = ns.patches + [{'name': node.metadata.name,
                                          'labels': node_ns.drop,
                                          'annotations': unmark}] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.patches }}

- name: Remove Mutex Labels And Node Annotations
  kubernetes.core.k8s:
    state: patched
    api_version: "v1"
    kind: Node
    name: "{{ item.name }}"
    definition:
      metadata:
        labels: "{{ item.labels }}"
        annotations: "{{ item.annotations }}"
  loop: "{{ mutexrunconfig_restore_node_patches }}"
  loop_control:
    label: "{{ item.name }}"

- name: Unpause Pools Paused By This MutexRunConfig
  kubernetes.core.k8s:
    state: patched
    merge_type: merge
    api_version: "machineconfiguration.openshift.io/v1"
    kind: MachineConfigPool
    name: "{{ item }}"
    definition:
      metadata:
        annotations:
          openshift-optional.skrzypek.io/paused-by: null
      spec:
        paused: false
  loop: "{{ mutexrunconfig_unpause_pools }}"

- name: Record Restored Pools
  ansible.builtin.set_fact:
    mutexrunconfig_restored_pools: >-
      {{ (mutexrunconfig_selector_pools_first + mutexrunconfig_selector_pools_last) | map(attribute='metadata.name') | list }}
