---
# Processes one target node (loop var targetNode):
#   1. a node already at desired_version without this run's released-by
#      annotation is skipped: it was never behind, or its Jobs, cleanup
#      included, are done. Only leftover mutex labels are removed;
#   2. otherwise the pre-upgrade Job of every rule whose label the node still
#      carries runs (a Job that already completed for this node, rule and
#      version is reused, see 07-run-job.yml);
#   3. one patch removes the node's mutex labels and its labelled-by
#      annotation and sets released-by '<owner>|<desired_version>', so it
#      joins the canary pool and MCO upgrades it;
#   4. the role waits until the node has finished its upgrade: the
#      release-image-version label is desired_version, the MCO daemon reports
#      state Done with currentConfig equal to desiredConfig, and the node is
#      Ready (mutexrunconfig_node_upgrade_retries x _delay);
#   5. the cleanup Job of every rule that has a cleanUpJobSpec runs, and then
#      the released-by annotation is removed.
# A node that still carries released-by for desired_version was released by
# an earlier reconcile that then stopped (a failed or timed-out wait or
# cleanup Job, or an operator restart). It resumes at step 4: its pre-upgrade
# Jobs are not run again, and its cleanup Jobs run before the next node is
# touched (07 reuses a Complete one, waits for a running one and replaces a
# failed one).
# Any failure sets JobRun=false, which skips the remaining nodes; the pools
# stay paused (see main.yml). The loop's own 'when' is evaluated for every
# node before the first one runs, so the block checks JobRun itself (through
# a copy, because block conditions also apply to the rescue).
#
# A delete does not interrupt a running reconcile: ansible-operator runs the
# finalizer only after this reconcile returns. So before each node the
# MutexRunConfig is read again and, once it is being deleted, the remaining
# nodes are skipped and the finalizer takes over.
- name: Read The MutexRunConfig Again
  kubernetes.core.k8s_info:
    api_version: "openshift-optional.skrzypek.io/v1alpha1"
    kind: MutexRunConfig
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: mutexrunconfig_current
  when: JobRun | bool

- name: Stop When The MutexRunConfig Is Being Deleted
  ansible.builtin.set_fact:
    JobRun: false
    mutexrunconfig_deleting: true
    mutexrunconfig_failure: >-
      The MutexRunConfig is being deleted, so {{ targetNode }} and the nodes after it were not processed.
      Its finalizer restores the pools, labels and selectors next.
  when:
    - JobRun | bool
    - (mutexrunconfig_current.resources | length == 0)
      or ((mutexrunconfig_current.resources[0].metadata.deletionTimestamp | default('', true)) | length > 0)

- name: Decide Whether To Process This Node
  ansible.builtin.set_fact:
    mutexrunconfig_node_enabled: "{{ JobRun }}"

- name: Job Execution Block
  when: mutexrunconfig_node_enabled | bool
  block:
    - name: Start Node
      ansible.builtin.set_fact:
        mutexrunconfig_node_step: jobs
        mutexrunconfig_node_position: "{{ ansible_loop.index }} of {{ ansible_loop.length }}"

    - name: Get Node Details
      kubernetes.core.k8s_info:
        api_version: "v1"
        kind: Node
        name: "{{ targetNode }}"
      register: nodeResource

    - name: Fail On Missing Node
      ansible.builtin.fail:
        msg: Node {{ targetNode }} was not found.
      when: nodeResource.resources | length == 0

    - name: Set Node Facts
      ansible.builtin.set_fact:
        mutexrunconfig_node_labels: "{{ nodeResource.resources[0].metadata.labels | default({}, true) }}"
        mutexrunconfig_node_annotations: "{{ nodeResource.resources[0].metadata.annotations | default({}, true) }}"

    - name: Set Node Rule Facts
      ansible.builtin.set_fact:
        mutexrunconfig_node_version: "{{ mutexrunconfig_node_labels[mutexrunconfig_version_label] | default('') }}"
        mutexrunconfig_held_rules: "{{ mutexrunconfig_rules | selectattr('label', 'in', mutexrunconfig_node_labels) | list }}"
        mutexrunconfig_node_released: >-
          {{ mutexrunconfig_node_annotations[mutexrunconfig_annotation_released_by] | default('') == mutexrunconfig_released_marker }}
        mutexrunconfig_node_held_by_us: >-
          {{ mutexrunconfig_node_annotations[mutexrunconfig_annotation_labelled_by] | default('') == mutexrunconfig_owner }}

    - name: Check Whether The Node Is Already Upgraded
      ansible.builtin.set_fact:
        mutexrunconfig_node_upgraded: >-
          {{ not mutexrunconfig_node_released | bool
             and mutexrunconfig_node_version is match(mutexrunconfig_semver_regex)
             and not (mutexrunconfig_node_version is version(desired_version, 'lt', version_type='semver')) }}

    - name: Remove Leftover Mutex Labels From An Upgraded Node
      kubernetes.core.k8s:
        state: patched
        api_version: "v1"
        kind: Node
        name: "{{ targetNode }}"
        definition:
          metadata:
            labels: "{{ mutexrunconfig_remove_labels }}"
            annotations: "{{ {mutexrunconfig_annotation_labelled_by: none} if mutexrunconfig_node_held_by_us | bool else {} }}"
      when:
        - mutexrunconfig_node_upgraded | bool
        - (mutexrunconfig_held_rules | length > 0) or (mutexrunconfig_node_held_by_us | bool)

    - name: Report Node Already Upgraded
      operator_sdk.util.k8s_status:
        api_version: "openshift-optional.skrzypek.io/v1alpha1"
        kind: MutexRunConfig
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        conditions:
          - type: NodeUpgrade
            status: "True"
            reason: NodeAlreadyUpgraded
            message: >-
              {{ targetNode }} already runs {{ mutexrunconfig_node_version }} and has no Jobs left to run.
              Node is {{ mutexrunconfig_node_position }}
            lastTransitionTime: "{{ mutexrunconfig_now }}"
      when: mutexrunconfig_node_upgraded | bool

    - name: Upgrade Node
      when: not mutexrunconfig_node_upgraded | bool
      block:
        - name: Launch K8s Jobs
          ansible.builtin.include_tasks: 07-run-job.yml
          loop: "{{ mutexrunconfig_held_rules if not mutexrunconfig_node_released | bool else [] }}"
          loop_control:
            loop_var: mutexrunconfig_rule
            label: "{{ mutexrunconfig_rule.namespace }}/{{ mutexrunconfig_rule.name }}"
          vars:
            mutexrunconfig_job_phase: pre

        - name: Report Job Run Finish
          operator_sdk.util.k8s_status:
            api_version: "openshift-optional.skrzypek.io/v1alpha1"
            kind: MutexRunConfig
            name: "{{ ansible_operator_meta.name }}"
            namespace: "{{ ansible_operator_meta.namespace }}"
            conditions:
              - type: JobRun
                status: "True"
                reason: JobRunSucceeded
                message: |-
                  Jobs for {{ targetNode }} have run successfully.
                  Node is {{ mutexrunconfig_node_position }}
                lastTransitionTime: "{{ mutexrunconfig_now }}"
          when: not mutexrunconfig_node_released | bool

        # One patch, so the node is never released without the annotation
        # that makes a later reconcile run its cleanup Jobs.
        - name: Release The Node
          kubernetes.core.k8s:
            state: patched
            api_version: "v1"
            kind: Node
            name: "{{ targetNode }}"
            definition:
              metadata:
                labels: "{{ mutexrunconfig_remove_labels }}"
                annotations: "{{ {mutexrunconfig_annotation_labelled_by: none, mutexrunconfig_annotation_released_by: mutexrunconfig_released_marker} }}"
          when: >-
            not mutexrunconfig_node_released | bool
            or mutexrunconfig_held_rules | length > 0
            or mutexrunconfig_node_held_by_us | bool

        - name: Set Node Step
          ansible.builtin.set_fact:
            mutexrunconfig_node_step: wait

        - name: Wait Until The Node Has Finished Its Upgrade
          kubernetes.core.k8s_info:
            api_version: "v1"
            kind: Node
            name: "{{ targetNode }}"
          register: mutexrunconfig_wait_info
          until: mutexrunconfig_wait_problems | length == 0
          retries: "{{ mutexrunconfig_node_upgrade_retries }}"
          delay: "{{ mutexrunconfig_node_upgrade_delay }}"
          failed_when: false

        - name: Fail When The Node Did Not Finish Its Upgrade
          ansible.builtin.fail:
            msg: >-
              {{ targetNode }} did not finish its upgrade to {{ desired_version }} within
              {{ (mutexrunconfig_node_upgrade_retries | int) * (mutexrunconfig_node_upgrade_delay | int) }}s:
              {{ mutexrunconfig_wait_problems | join('; ') }}.
          when: mutexrunconfig_wait_problems | length > 0

        - name: Set Node Step
          ansible.builtin.set_fact:
            mutexrunconfig_node_step: cleanup

        - name: Launch K8s Clean Up Jobs
          ansible.builtin.include_tasks: 07-run-job.yml
          loop: "{{ mutexrunconfig_rules | selectattr('has_cleanup') | list }}"
          loop_control:
            loop_var: mutexrunconfig_rule
            label: "{{ mutexrunconfig_rule.namespace }}/{{ mutexrunconfig_rule.name }}"
          vars:
            mutexrunconfig_job_phase: cleanup

        - name: Clear The Release Mark
          kubernetes.core.k8s:
            state: patched
            api_version: "v1"
            kind: Node
            name: "{{ targetNode }}"
            definition:
              metadata:
                annotations: "{{ {mutexrunconfig_annotation_released_by: none} }}"

        - name: Report Cleanup Of A Resumed Node
          operator_sdk.util.k8s_status:
            api_version: "openshift-optional.skrzypek.io/v1alpha1"
            kind: MutexRunConfig
            name: "{{ ansible_operator_meta.name }}"
            namespace: "{{ ansible_operator_meta.namespace }}"
            conditions:
              - type: JobRun
                status: "True"
                reason: JobRunSucceeded
                message: |-
                  Jobs for {{ targetNode }} have run successfully (its cleanup Jobs after a retry).
                  Node is {{ mutexrunconfig_node_position }}
                lastTransitionTime: "{{ mutexrunconfig_now }}"
          when: mutexrunconfig_node_released | bool

        - name: Report Upgrade Finish
          operator_sdk.util.k8s_status:
            api_version: "openshift-optional.skrzypek.io/v1alpha1"
            kind: MutexRunConfig
            name: "{{ ansible_operator_meta.name }}"
            namespace: "{{ ansible_operator_meta.namespace }}"
            conditions:
              - type: NodeUpgrade
                status: "True"
                reason: NodeUpgradeSucceeded
                message: |-
                  Upgrade for {{ targetNode }} has run successfully.
                  Node is {{ mutexrunconfig_node_position }}
                lastTransitionTime: "{{ mutexrunconfig_now }}"

  rescue:
    - name: Set JobRun
      ansible.builtin.set_fact:
        JobRun: false
        mutexrunconfig_failure: "{{ targetNode }} ({{ mutexrunconfig_node_step | default('jobs') }}): {{ mutexrunconfig_failed_msg }}"

    - name: Report Job Run Failure
      operator_sdk.util.k8s_status:
        api_version: "openshift-optional.skrzypek.io/v1alpha1"
        kind: MutexRunConfig
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        conditions:
          - type: JobRun
            status: "False"
            reason: JobRunFailed
            message: |-
              Jobs for {{ targetNode }} have run not successfully: {{ mutexrunconfig_failed_msg | truncate(900) }}
              Node is {{ mutexrunconfig_node_position | default('') }}
            lastTransitionTime: "{{ mutexrunconfig_now }}"
      when: mutexrunconfig_node_step | default('jobs') != 'wait'

    - name: Report Upgrade Failure
      operator_sdk.util.k8s_status:
        api_version: "openshift-optional.skrzypek.io/v1alpha1"
        kind: MutexRunConfig
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        conditions:
          - type: NodeUpgrade
            status: "False"
            reason: NodeUpgradeFailed
            message: |-
              Upgrade for {{ targetNode }} has run not successfully: {{ mutexrunconfig_failed_msg | truncate(900) }}
              Node is {{ mutexrunconfig_node_position | default('') }}
            lastTransitionTime: "{{ mutexrunconfig_now }}"
      when: mutexrunconfig_node_step | default('jobs') == 'wait'
