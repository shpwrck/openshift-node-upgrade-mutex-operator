---
# Reports, at the end of every reconcile, which pools hold the run and whether
# that is because something failed. The pools held are those paused by this
# MutexRunConfig (paused-by), target pools paused by someone else, and pools
# whose node selector this MutexRunConfig still has changed (modified-by).
#   TargetPoolsPaused=True  Paused     a target pool is paused; the message
#                                      tells pools paused by this
#                                      MutexRunConfig from pools paused by
#                                      someone else, which it never unpauses;
#   Degraded=True  PoolsLeftPaused  a step failed while pools are held: they
#                                   stay as they are (no node is upgraded
#                                   without its jobs) and the next reconcile
#                                   retries;
#   Degraded=False RunInProgress    pools are held for an upgrade in progress;
#   Degraded=False NoPoolsPaused    nothing is paused or changed by this
#                                   MutexRunConfig.
- name: List MachineConfigPools
  kubernetes.core.k8s_info:
    api_version: "machineconfiguration.openshift.io/v1"
    kind: MachineConfigPool
  register: mutexrunconfig_report_pools

- name: Reset Report Facts
  ansible.builtin.set_fact:
    mutexrunconfig_paused_pools: []
    mutexrunconfig_other_paused_pools: []
    mutexrunconfig_modified_pools: []

- name: Find Pools Held By This MutexRunConfig
  ansible.builtin.set_fact:
    mutexrunconfig_paused_pools: >-
      {{ mutexrunconfig_paused_pools + ([item.metadata.name] if mutexrunconfig_pool_paused and mutexrunconfig_pool_paused_by == mutexrunconfig_owner
                                        else []) }}
    mutexrunconfig_other_paused_pools: >-
      {{ mutexrunconfig_other_paused_pools
         + ([item.metadata.name] if (mutexrunconfig_pool_paused and mutexrunconfig_pool_paused_by != mutexrunconfig_owner
                                     and (item.metadata.name in machineConfigPoolList or mutexrunconfig_pool_modified_by == mutexrunconfig_owner))
            else []) }}
    mutexrunconfig_modified_pools: >-
      {{ mutexrunconfig_modified_pools + ([item.metadata.name] if mutexrunconfig_pool_modified_by == mutexrunconfig_owner else []) }}
  loop: "{{ mutexrunconfig_report_pools.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  vars:
    mutexrunconfig_pool_annotations: "{{ item.metadata.annotations | default({}, true) }}"
    mutexrunconfig_pool_paused: "{{ item.spec.paused | default(false) | bool }}"
    mutexrunconfig_pool_paused_by: "{{ mutexrunconfig_pool_annotations[mutexrunconfig_annotation_paused_by] | default('') }}"
    mutexrunconfig_pool_modified_by: "{{ mutexrunconfig_pool_annotations[mutexrunconfig_annotation_modified_by] | default('') }}"

- name: Describe The Held Pools
  ansible.builtin.set_fact:
    mutexrunconfig_held_paused_pools: "{{ mutexrunconfig_paused_pools + mutexrunconfig_other_paused_pools }}"
    mutexrunconfig_paused_description: >-
      {{ (mutexrunconfig_paused_pools + (mutexrunconfig_other_paused_pools | map('regex_replace', '$', ' (paused by someone else)') | list))
         | join(', ') }}
    mutexrunconfig_degraded_reason: >-
      {{ 'PoolsLeftPaused'
         if mutexrunconfig_failure | length > 0
            and (mutexrunconfig_paused_pools + mutexrunconfig_modified_pools) | length > 0
         else ('RunInProgress' if (mutexrunconfig_paused_pools + mutexrunconfig_modified_pools) | length > 0 else 'NoPoolsPaused') }}

- name: Report Paused
  operator_sdk.util.k8s_status:
    api_version: "nodeupgrade.redhat-na-ssa.github.io/v1alpha1"
    kind: MutexRunConfig
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
    conditions:
      - type: TargetPoolsPaused
        status: "{{ (mutexrunconfig_held_paused_pools | length > 0) | ternary('True', 'False') }}"
        reason: "{{ (mutexrunconfig_held_paused_pools | length > 0) | ternary('Paused', 'NotPaused') }}"
        message: >-
          {{ (('MachineConfigPools paused by this MutexRunConfig: ' ~ (mutexrunconfig_paused_pools | join(', ')) ~ '.')
              if mutexrunconfig_paused_pools | length > 0
              else 'No MachineConfigPool is paused by this MutexRunConfig.')
             ~ ((' Target MachineConfigPools paused by someone else, which this MutexRunConfig never unpauses: '
                 ~ (mutexrunconfig_other_paused_pools | join(', ')) ~ '.')
                if mutexrunconfig_other_paused_pools | length > 0 else '') }}
        lastTransitionTime: "{{ mutexrunconfig_now }}"
      - type: Degraded
        status: "{{ (mutexrunconfig_degraded_reason == 'PoolsLeftPaused') | ternary('True', 'False') }}"
        reason: "{{ mutexrunconfig_degraded_reason }}"
        message: >-
          {%- set paused = ('MachineConfigPools ' ~ mutexrunconfig_paused_description)
                           if mutexrunconfig_held_paused_pools | length > 0 else '' -%}
          {%- set changed = (' the node selectors of ' ~ (mutexrunconfig_modified_pools | join(', ')))
                            if mutexrunconfig_modified_pools | length > 0 else '' -%}
          {%- set others = (' A pool paused by someone else stays paused until you unpause it.'
                            if mutexrunconfig_other_paused_pools | length > 0 else '') -%}
          {%- set error = mutexrunconfig_failure | truncate(1500) -%}
          {%- if mutexrunconfig_degraded_reason == 'NoPoolsPaused' -%}
          No MachineConfigPool is paused by this MutexRunConfig.
          {{- (' Last error: ' ~ error) if mutexrunconfig_failure | length > 0 else '' -}}
          {%- elif mutexrunconfig_degraded_reason == 'RunInProgress' -%}
          {{ ((paused ~ ' are paused') if paused else ('This run has changed' ~ changed))
             ~ ' while the upgrade to ' ~ (desired_version | default('the desired version')) ~ ' is in progress.' }}
          {%- elif mutexrunconfig_deleting | bool -%}
          {{ error ~ ' Still held: ' ~ ([paused, changed | trim] | select | join('; ')) ~ '.' ~ others }}
          {%- else -%}
          {{ ((paused ~ ' stay paused after a failure'
               ~ ((',' ~ changed ~ ' stay changed and the nodes keep their mutex labels') if changed else '')
               ~ ', so no target node is upgraded without its jobs.')
              if paused
              else ('No MachineConfigPool is paused any more, but after a failure' ~ changed
                    ~ ' stay changed and the nodes keep their mutex labels.'))
             ~ ' Error: ' ~ error
             ~ ' The operator retries on the next reconcile. To abort instead, delete this MutexRunConfig: its finalizer'
             ~ ' unpauses the pools it paused, removes the mutex labels and restores the node selectors, and MCO then'
             ~ ' upgrades the remaining nodes WITHOUT running their MutexRule jobs.' ~ others }}
          {%- endif -%}
        lastTransitionTime: "{{ mutexrunconfig_now }}"
