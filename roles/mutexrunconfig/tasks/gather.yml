---
- name: Read the ClusterVersion
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: ClusterVersion
    name: version
  register: mutexrunconfig_cluster_version

- name: List MutexRunConfigs
  kubernetes.core.k8s_info:
    api_version: nodeupgrade.redhat-na-ssa.github.io/v1alpha1
    kind: MutexRunConfig
  register: mutexrunconfig_run_configs

- name: List MutexRules
  kubernetes.core.k8s_info:
    api_version: nodeupgrade.redhat-na-ssa.github.io/v1alpha1
    kind: MutexRule
  register: mutexrunconfig_rules

- name: List MutexTargets
  kubernetes.core.k8s_info:
    api_version: nodeupgrade.redhat-na-ssa.github.io/v1alpha1
    kind: MutexTarget
  register: mutexrunconfig_targets

- name: List MachineConfigPools
  kubernetes.core.k8s_info:
    api_version: machineconfiguration.openshift.io/v1
    kind: MachineConfigPool
  register: mutexrunconfig_pools

- name: List nodes
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: mutexrunconfig_nodes

# Rendered MachineConfigs are large, so only the ones that nodes run or pools
# want are read.
- name: Read rendered MachineConfigs
  kubernetes.core.k8s_info:
    api_version: machineconfiguration.openshift.io/v1
    kind: MachineConfig
    name: "{{ item }}"
  loop: "{{ mutexrunconfig_nodes.resources | nodeupgrade_rendered_config_names(mutexrunconfig_pools.resources) }}"
  register: mutexrunconfig_machine_configs

- name: List the Jobs of this MutexRunConfig
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    label_selectors:
      - "{{ 'RUN_CONFIG_UID_LABEL' | nodeupgrade_const }}={{ mutexrunconfig_object.metadata.uid }}"
  register: mutexrunconfig_jobs

- name: List APIServices
  kubernetes.core.k8s_info:
    api_version: apiregistration.k8s.io/v1
    kind: APIService
  register: mutexrunconfig_api_services
