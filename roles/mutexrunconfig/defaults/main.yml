---
# defaults file for MutexRunConfig

# How long to wait for a released node to finish its upgrade (the desired
# machineconfiguration.openshift.io/release-image-version label, MCO state Done
# with currentConfig equal to desiredConfig, and Ready) after its mutex labels
# were removed: retries x delay seconds (default 120 x 60s = 2 hours per node).
# How long one Job may run is set per MutexRule (spec.timeoutSeconds, default
# 3600 in the CRD).
mutexrunconfig_node_upgrade_retries: 120
mutexrunconfig_node_upgrade_delay: 60

# How often a running Job is polled for a Complete or Failed condition.
mutexrunconfig_job_poll_delay: 10

# APIService availability check: attempts and delay between them, so that a
# short flap of an aggregated API does not fail the reconcile.
mutexrunconfig_apiservice_retries: 3
mutexrunconfig_apiservice_delay: 10
