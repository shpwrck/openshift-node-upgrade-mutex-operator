---
# This role is run by ansible-operator (see watches.yaml), not installed from
# Ansible Galaxy. The image is quay.io/operator-framework/ansible-operator
# v1.42.3, which ships ansible-core 2.18.
galaxy_info:
  role_name: mutexrunconfig
  author: openshift-node-upgrade-mutex-operator maintainers
  description: >-
    Reconciles MutexRunConfig resources for the OpenShift Node Upgrade Mutex Operator:
    during an OpenShift upgrade, runs the MutexRule Jobs for each target node and
    releases one node at a time into the canary MachineConfigPool.
  # The repository's license (LICENSE).
  license: Apache-2.0
  min_ansible_version: "2.18"
  galaxy_tags:
    - openshift
    - operator
    - upgrade

dependencies: []

collections:
  - operator_sdk.util
  - kubernetes.core
