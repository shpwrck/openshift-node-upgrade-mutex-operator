---
- name: Validate
  block:
    - name: Check Pool List
      ansible.builtin.fail:
        msg: spec.machineConfigPools is empty.
      when: _nodeupgrade_redhat_na_ssa_github_io_mutextarget_spec.machineConfigPools | default([], true) | length == 0

    - name: Gather Machine Config Pools
      kubernetes.core.k8s_info:
        api_version: "machineconfiguration.openshift.io/v1"
        kind: MachineConfigPool
        name: "{{ item }}"
      loop: "{{ _nodeupgrade_redhat_na_ssa_github_io_mutextarget_spec.machineConfigPools }}"
      register: machineConfigPools

    - name: Fail On Missing Machine Config Pools
      ansible.builtin.fail:
        msg: >-
          MachineConfigPool(s) {{ machineConfigPools.results | selectattr('resources', 'equalto', [])
          | map(attribute='item') | join(', ') }} were not found.
      when: machineConfigPools.results | selectattr('resources', 'equalto', []) | list | length > 0

    - name: Report Configuration Results
      operator_sdk.util.k8s_status:
        api_version: "nodeupgrade.redhat-na-ssa.github.io/v1alpha1"
        kind: MutexTarget
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        conditions:
          - type: ValidConfig
            status: "True"
            reason: MachineConfigPoolFetchSucceeded
            message: MachineConfigPools were successfully fetched.
            lastTransitionTime: "{{ mutextarget_now }}"

    - name: Set Configuration Status
      ansible.builtin.set_fact:
        ValidConfig: true

  rescue:
    - name: Set Configuration Status
      ansible.builtin.set_fact:
        ValidConfig: false

    # replace: true drops status.nodes and the NodeListGathered condition, so
    # an invalid target never shows a stale node list.
    - name: Report Invalid Config
      operator_sdk.util.k8s_status:
        api_version: "nodeupgrade.redhat-na-ssa.github.io/v1alpha1"
        kind: MutexTarget
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        replace: true
        status:
          nodes: []
        conditions:
          - type: ValidConfig
            status: "False"
            reason: MachineConfigPoolFetchFailed
            message: "{{ mutextarget_failed_msg | truncate(1000) }}"
            lastTransitionTime: "{{ mutextarget_now }}"
