---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mutextargets.nodeupgrade.redhat-na-ssa.github.io
spec:
  group: nodeupgrade.redhat-na-ssa.github.io
  names:
    kind: MutexTarget
    listKind: MutexTargetList
    plural: mutextargets
    singular: mutextarget
    categories:
    - numo
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Pools
      type: string
      jsonPath: .spec.machineConfigPools
    - name: Valid
      type: string
      jsonPath: .status.conditions[?(@.type=="Valid")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        description: MutexTarget names the MachineConfigPools whose nodes are updated one at a time.
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - machineConfigPools
            properties:
              machineConfigPools:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
                description: Names of existing MachineConfigPools. The master pool cannot be a target.
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
                description: The metadata.generation that the operator last reconciled.
              nodes:
                type: array
                items:
                  type: string
                description: Nodes that belong to the pools, in update order.
              conditions:
                description: Conditions describe the latest observations of the resource.
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                      description: Type of the condition.
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    reason:
                      type: string
                      description: A CamelCase reason for the last transition.
                    message:
                      type: string
                      description: A human readable explanation.
                    lastTransitionTime:
                      type: string
                      format: date-time
