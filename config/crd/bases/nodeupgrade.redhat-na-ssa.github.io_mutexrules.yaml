---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mutexrules.nodeupgrade.redhat-na-ssa.github.io
spec:
  group: nodeupgrade.redhat-na-ssa.github.io
  names:
    kind: MutexRule
    listKind: MutexRuleList
    plural: mutexrules
    singular: mutexrule
    categories:
    - numo
  scope: Namespaced
  versions:
  - name: v1alpha1
    additionalPrinterColumns:
    - name: Job Name
      type: string
      description: Prefix of the Jobs generated from this rule
      jsonPath: .spec.jobName
    - name: Job Namespace
      type: string
      description: Namespace the Jobs run in (empty means the namespace of the MutexRule)
      jsonPath: .spec.jobNamespace
    - name: ValidConfig
      type: string
      description: Status of the ValidConfig condition
      jsonPath: .status.conditions[?(@.type=="ValidConfig")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        description: |-
          MutexRule is one operation that must run before each target node is upgraded, given
          as a batch/v1 JobSpec. The operator validates the JobSpec with a server-side dry-run
          create (nothing is created) and reports the result in the ValidConfig condition. A
          MutexRunConfig that references the rule runs one Job per target node during an
          upgrade.
          The name of a MutexRule must not contain '.', and '<name>.<namespace>' must be at
          most 63 characters, because the rule is tracked with the node label
          mutexrule.nodeupgrade.redhat-na-ssa.github.io/<name>.<namespace>. MutexRules are only
          reconciled in the namespace of the operator.
        type: object
        required:
        - spec
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of MutexRule.
            type: object
            required:
            - jobName
            - jobSpec
            properties:
              jobName:
                description: |-
                  Prefix of the Jobs generated from this rule. Pre-upgrade Jobs are created with
                  generateName '<jobName>-' (for example "testjob-e7va7") and cleanup Jobs with
                  'cleanup-<jobName>-'. A DNS-1123 label of at most 52 characters.
                type: string
                minLength: 1
                maxLength: 52
                pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
              jobNamespace:
                description: |-
                  Namespace the Jobs run in. Defaults to the namespace of the MutexRule. The
                  operator does not create this namespace, a ServiceAccount, or any RBAC that
                  the Jobs need.
                type: string
                minLength: 1
                maxLength: 63
                pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
              jobSpec:
                description: |-
                  A batch/v1 JobSpec (https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/job-v1/#JobSpec)
                  that runs once for each target node, before the node is released for its
                  upgrade. The Jobs of a node run one after another, in the order of
                  spec.mutexRules of the MutexRunConfig. To the Job it creates the operator adds:
                  the env vars NODE_NAME (the node about to be upgraded) and MUTEX_RULE (the name
                  of this rule) to every container and initContainer, replacing entries with the
                  same names; a 'kubernetes.io/hostname NotIn [<node>]' matchExpression to every
                  required nodeSelectorTerm (or one new term), so the pod never runs on that
                  node; the label nodeupgrade.redhat-na-ssa.github.io/job-key; and the annotations
                  nodeupgrade.redhat-na-ssa.github.io/mutexrunconfig, nodeupgrade.redhat-na-ssa.github.io/mutexrule,
                  nodeupgrade.redhat-na-ssa.github.io/node, nodeupgrade.redhat-na-ssa.github.io/phase and
                  nodeupgrade.redhat-na-ssa.github.io/desired-version. The Job must reach Complete
                  within timeoutSeconds; a Failed Job stops the run.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              cleanUpJobSpec:
                description: |-
                  Optional batch/v1 JobSpec that runs once for each target node after the node
                  has finished its upgrade (release-image-version label, MCO state Done,
                  currentConfig equal to desiredConfig, Ready). The operator makes the same
                  additions as for jobSpec.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              type:
                description: Rule type. Only 'kubernetes' (a Kubernetes Job) is supported.
                type: string
                default: kubernetes
                enum:
                - kubernetes
              timeoutSeconds:
                description: |-
                  Maximum number of seconds each pre-upgrade or cleanup Job of this rule may run
                  before the run stops with JobRun=False. Defaults to 3600.
                type: integer
                minimum: 1
                default: 3600
          status:
            description: |-
              Status defines the observed state of MutexRule. Written by the operator. Conditions:
              ValidConfig (True/ValidConfig, or False/InvalidConfig with the error of the API
              server) and Reconciled (False/NamespaceNotAllowed outside the namespace of the
              operator).
            type: object
            x-kubernetes-preserve-unknown-fields: true
            properties:
              conditions:
                description: Conditions, at most one per type, merged by type on every reconcile.
                type: array
                items:
                  type: object
                  properties:
                    lastTransitionTime:
                      description: RFC 3339 UTC time (YYYY-MM-DDTHH:MM:SSZ) at which status, reason or message last changed.
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      description: True, False or Unknown.
                      type: string
                    type:
                      type: string
    served: true
    storage: true
    subresources:
      status: {}
