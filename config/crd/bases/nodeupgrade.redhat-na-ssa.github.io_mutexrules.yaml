---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mutexrules.nodeupgrade.redhat-na-ssa.github.io
spec:
  group: nodeupgrade.redhat-na-ssa.github.io
  names:
    kind: MutexRule
    listKind: MutexRuleList
    plural: mutexrules
    singular: mutexrule
    categories:
    - numo
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Job Name
      type: string
      jsonPath: .spec.jobName
    - name: Job Namespace
      type: string
      jsonPath: .spec.jobNamespace
    - name: Valid
      type: string
      jsonPath: .status.conditions[?(@.type=="Valid")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        description: MutexRule describes Jobs that run before and after each target node is updated.
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - jobName
            - jobNamespace
            - jobSpec
            properties:
              jobName:
                type: string
                maxLength: 48
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                description: 'Prefix for the Jobs this rule creates: <jobName>-xxxxx before the update and cleanup-<jobName>-xxxxx
                  after it.'
              jobNamespace:
                type: string
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                description: Existing namespace for the Jobs. The Jobs' service account needs whatever RBAC they use; the
                  operator creates none.
              jobSpec:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: Runs before the node is updated. A batch/v1 JobSpec. The operator adds NODE_NAME, MUTEX_RULE,
                  MUTEX_STAGE and TARGET_VERSION to every container and keeps the Job's pods off the node being updated.
              cleanUpJobSpec:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: Optional. Runs after the node is updated. A batch/v1 JobSpec. The operator adds NODE_NAME, MUTEX_RULE,
                  MUTEX_STAGE and TARGET_VERSION to every container and keeps the Job's pods off the node being updated.
              type:
                type: string
                enum:
                - kubernetes
                default: kubernetes
                description: Kind of rule. Only kubernetes (a Job) is supported.
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
                description: The metadata.generation that the operator last reconciled.
              conditions:
                description: Conditions describe the latest observations of the resource.
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                      description: Type of the condition.
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    reason:
                      type: string
                      description: A CamelCase reason for the last transition.
                    message:
                      type: string
                      description: A human readable explanation.
                    lastTransitionTime:
                      type: string
                      format: date-time
