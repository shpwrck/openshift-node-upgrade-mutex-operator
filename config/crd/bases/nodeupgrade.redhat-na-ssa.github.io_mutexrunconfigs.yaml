---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mutexrunconfigs.nodeupgrade.redhat-na-ssa.github.io
spec:
  group: nodeupgrade.redhat-na-ssa.github.io
  names:
    kind: MutexRunConfig
    listKind: MutexRunConfigList
    plural: mutexrunconfigs
    singular: mutexrunconfig
    categories:
    - numo
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Canary
      type: string
      jsonPath: .spec.canary.name
    - name: Target Version
      type: string
      jsonPath: .status.targetVersion
    - name: Current Node
      type: string
      jsonPath: .status.currentNode
    - name: Status
      type: string
      jsonPath: .status.conditions[?(@.type=="Progressing")].reason
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        description: MutexRunConfig rolls each OpenShift update through the target nodes one node at a time, running the MutexRules'
          Jobs around each node.
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - canary
            - mutexTargets
            properties:
              canary:
                type: object
                required:
                - name
                description: The pool nodes are updated in.
                properties:
                  name:
                    type: string
                    minLength: 1
                    description: An existing, unpaused MachineConfigPool that selects no nodes and is not a target.
              mutexRules:
                type: array
                items: &id001
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                    namespace:
                      type: string
                      description: Defaults to the namespace of the MutexRunConfig.
                default: []
                description: MutexRules whose Jobs run for every node, in this order.
              mutexTargets:
                type: array
                items: *id001
                minItems: 1
                description: MutexTargets whose nodes are updated, in this order.
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
                description: The metadata.generation that the operator last reconciled.
              targetVersion:
                type: string
                description: The OpenShift version being rolled out.
              currentNode:
                type: string
                description: The node being updated, if any.
              nodes:
                type: array
                description: Every target node and where it stands.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    phase:
                      type: string
                      enum:
                      - Pending
                      - PreUpdate
                      - Updating
                      - PostUpdate
                      - Complete
                      - UpToDate
                    version:
                      type: string
                      description: The OpenShift version the node runs.
              conditions:
                description: Conditions describe the latest observations of the resource.
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                      description: Type of the condition.
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    reason:
                      type: string
                      description: A CamelCase reason for the last transition.
                    message:
                      type: string
                      description: A human readable explanation.
                    lastTransitionTime:
                      type: string
                      format: date-time
