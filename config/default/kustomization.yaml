# Adds namespace to all resources.
namespace: openshift-node-upgrade-mutex-operator-system

# Prepended to the names of all resources.
namePrefix: openshift-node-upgrade-mutex-operator-

resources:
- ../crd
- ../rbac
- ../manager
# Serves /metrics over HTTPS on :8443 to callers with the metrics-reader role.
- metrics_service.yaml
# To create a ServiceMonitor for the Prometheus Operator, uncomment:
# - ../prometheus

patches:
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
