# Permissions for leader election. ansible-operator v1.42 always uses a
# coordination.k8s.io Lease (its --leader-elect-resource-lock flag is
# deprecated and hard-coded to leases), so the scaffold's configmaps rule is
# not needed. Keep this Role small: with an AllNamespaces install OLM grants
# these namespaced permissions cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: role
    app.kubernetes.io/instance: leader-election-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: openshift-node-upgrade-mutex-operator
    app.kubernetes.io/part-of: openshift-node-upgrade-mutex-operator
    app.kubernetes.io/managed-by: kustomize
  name: leader-election-role
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
