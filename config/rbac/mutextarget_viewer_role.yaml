# Helper ClusterRole for people who view mutextargets. It is not used by the
# operator, is not listed in config/rbac/kustomization.yaml and is not
# shipped in the bundle.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: mutextarget-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: openshift-node-upgrade-mutex-operator
    app.kubernetes.io/part-of: openshift-node-upgrade-mutex-operator
    app.kubernetes.io/managed-by: kustomize
  name: mutextarget-viewer-role
rules:
- apiGroups:
  - openshift-optional.skrzypek.io
  resources:
  - mutextargets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - openshift-optional.skrzypek.io
  resources:
  - mutextargets/status
  verbs:
  - get
