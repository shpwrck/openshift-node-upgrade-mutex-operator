---
# Permissions of the operator's ServiceAccount (CSV clusterPermissions).
#
# Least privilege: each rule lists only what the roles in roles/ or
# ansible-operator itself call. Keep docs/USAGE.md ("Permissions") in sync.
#
# get/list/watch on every resource the roles read: ansible-operator serves
# GET and LIST requests from its informer cache when the operator watches all
# namespaces (WATCH_NAMESPACE empty), and that cache lists and watches the
# resource type.
#
# The scaffold's "base operator rules" (secrets, pods, pods/exec, pods/log and
# apps workloads) are gone: nothing in this operator uses them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
  ##
  ## Resources the roles act on
  ##
  # Jobs from MutexRule specs: dry-run create in the mutexrule role, real
  # create and polling in mutexrunconfig 07-run-job.yml, and a list by the
  # job-key label to reuse a Job a re-entered run already started. The
  # operator never deletes, patches or updates a Job.
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - watch
  # Nodes: read versions, pool membership and mutex labels; patch adds and
  # removes the mutexrule.openshift-optional.skrzypek.io/* labels.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
      - patch
  # MachineConfigPools: read selectors and pause state; patch sets
  # spec.paused, spec.nodeSelector.matchExpressions and the
  # openshift-optional.skrzypek.io/original-match-expressions and
  # openshift-optional.skrzypek.io/paused-by annotations.
  - apiGroups:
      - machineconfiguration.openshift.io
    resources:
      - machineconfigpools
    verbs:
      - get
      - list
      - watch
      - patch
  # ClusterVersion 'version': status.desired.version and status.history.
  - apiGroups:
      - config.openshift.io
    resources:
      - clusterversions
    verbs:
      - get
      - list
      - watch
  # APIService health gate before a run.
  - apiGroups:
      - apiregistration.k8s.io
    resources:
      - apiservices
    verbs:
      - get
      - list
      - watch
  ##
  ## The operator's own resources
  ##
  # get/list/watch: ansible-operator watches the CRs and the roles read the
  # referenced MutexRules and MutexTargets. update/patch: ansible-operator adds
  # and removes the MutexRunConfig finalizer. The operator never creates or
  # deletes its CRs.
  - apiGroups:
      - openshift-optional.skrzypek.io
    resources:
      - mutexrules
      - mutextargets
      - mutexrunconfigs
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # Status: the roles write it with operator_sdk.util.k8s_status (merge patch,
  # or a PUT with replace: true), and ansible-operator writes an error status
  # (PUT) when a reconcile cannot start.
  - apiGroups:
      - openshift-optional.skrzypek.io
    resources:
      - mutexrules/status
      - mutextargets/status
      - mutexrunconfigs/status
    verbs:
      - get
      - update
      - patch
  # The ansible-operator proxy sets an ownerReference with
  # blockOwnerDeletion on the Jobs created for a MutexRule (dry run) or a
  # MutexRunConfig. The OwnerReferencesPermissionEnforcement admission plugin
  # requires update on the owner's finalizers subresource for that.
  - apiGroups:
      - openshift-optional.skrzypek.io
    resources:
      - mutexrules/finalizers
      - mutexrunconfigs/finalizers
    verbs:
      - update
# +kubebuilder:scaffold:rules
