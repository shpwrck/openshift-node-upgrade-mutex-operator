---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
  # The operator's own resources
  - apiGroups:
      - nodeupgrade.redhat-na-ssa.github.io
    resources:
      - mutexrules
      - mutextargets
      - mutexrunconfigs
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - nodeupgrade.redhat-na-ssa.github.io
    resources:
      - mutexrules/status
      - mutextargets/status
      - mutexrunconfigs/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - nodeupgrade.redhat-na-ssa.github.io
    resources:
      - mutexrules/finalizers
      - mutextargets/finalizers
      - mutexrunconfigs/finalizers
    verbs:
      - update
  # Jobs from MutexRules, in any namespace
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - watch
  # Release labels and progress annotations on nodes
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - patch
      - watch
  # Pausing pools and pointing the canary pool at released nodes
  - apiGroups:
      - machineconfiguration.openshift.io
    resources:
      - machineconfigpools
    verbs:
      - get
      - list
      - patch
      - watch
  # Rendered MachineConfigs carry the OpenShift version
  - apiGroups:
      - machineconfiguration.openshift.io
    resources:
      - machineconfigs
    verbs:
      - get
      - list
      - watch
  # The version the cluster is updating to
  - apiGroups:
      - config.openshift.io
    resources:
      - clusterversions
    verbs:
      - get
      - list
      - watch
  # Aggregated APIs must be available before the next node goes
  - apiGroups:
      - apiregistration.k8s.io
    resources:
      - apiservices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
