# All RBAC will be applied under this service account in
# the deployment namespace. You may comment out this resource
# if your manager will use a service account that exists at
# runtime. Be sure to update RoleBinding and ClusterRoleBinding
# subjects if changing service account names.
resources:
- service_account.yaml
- role.yaml
- role_binding.yaml
- leader_election_role.yaml
- leader_election_role_binding.yaml
# The following RBAC configurations protect the metrics endpoint with
# authn/authz (--metrics-require-rbac). Comment them out together with
# config/default/manager_metrics_patch.yaml to disable that protection.
# More info: https://book.kubebuilder.io/reference/metrics.html
- metrics_auth_role.yaml
- metrics_auth_role_binding.yaml
- metrics_reader_role.yaml
# The mutex*_editor_role.yaml and mutex*_viewer_role.yaml helper ClusterRoles
# are deliberately not listed: they are not needed by the operator, and the
# editor roles must be granted explicitly (they are not aggregated into the
# built-in admin and edit roles).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
