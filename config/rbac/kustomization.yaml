- mutexrule_editor_role.yaml
- mutexrule_viewer_role.yaml
- mutextarget_editor_role.yaml
- mutextarget_viewer_role.yaml
- mutexrunconfig_editor_role.yaml
- mutexrunconfig_viewer_role.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
