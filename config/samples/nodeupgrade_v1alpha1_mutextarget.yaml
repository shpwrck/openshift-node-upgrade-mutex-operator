# A MutexTarget must be created in the operator's namespace. status.nodes
# lists the nodes that MCO assigns to these MachineConfigPools (a node in a
# custom pool belongs to that pool, not to 'worker').
apiVersion: nodeupgrade.redhat-na-ssa.github.io/v1alpha1
kind: MutexTarget
metadata:
  labels:
    app.kubernetes.io/name: mutextarget
    app.kubernetes.io/instance: mutextarget-sample
    app.kubernetes.io/part-of: openshift-node-upgrade-mutex-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: openshift-node-upgrade-mutex-operator
  name: mutextarget-sample
spec:
  machineConfigPools:
    - worker
