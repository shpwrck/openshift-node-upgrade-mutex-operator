# A MutexRunConfig must be created in the operator's namespace, and so must
# the MutexRules and MutexTargets it references: leave out 'namespace' on the
# references and they resolve in this MutexRunConfig's namespace. 'canary' is
# an existing, unpaused MachineConfigPool whose nodeSelector.matchLabels
# select the target nodes (see the canary example in the README).
apiVersion: openshift-optional.skrzypek.io/v1alpha1
kind: MutexRunConfig
metadata:
  labels:
    app.kubernetes.io/name: mutexrunconfig
    app.kubernetes.io/instance: mutexrunconfig-sample
    app.kubernetes.io/part-of: openshift-node-upgrade-mutex-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: openshift-node-upgrade-mutex-operator
  name: mutexrunconfig-sample
spec:
  canary:
    name: canary
  mutexRules:
    - name: mutexrule-sample
  mutexTargets:
    - name: mutextarget-sample
