---
# markUnsafe: ansible-operator marks every string value of the CR (not map
# keys or ansible_operator_meta) as unsafe, so Ansible never evaluates a template
# expression ('{{ }}') in a CR value; a Job argument with '{{' reaches the Job.
- version: v1alpha1
  group: nodeupgrade.redhat-na-ssa.github.io
  kind: MutexRule
  role: mutexrule
  reconcilePeriod: 10m
  manageStatus: false
  markUnsafe: true

- version: v1alpha1
  group: nodeupgrade.redhat-na-ssa.github.io
  kind: MutexTarget
  role: mutextarget
  reconcilePeriod: 10m
  manageStatus: false
  markUnsafe: true

# Deleting a MutexRunConfig runs the mutexrunconfig role once more with
# state=absent before the finalizer is removed. That run unpauses the
# MachineConfigPools this MutexRunConfig paused, removes its mutex labels and
# its release label from the nodes and restores the canary and target pool
# node selectors. Deleting a MutexRunConfig in the middle of an upgrade
# therefore lets MCO upgrade the remaining nodes without running their
# MutexRule jobs.
- version: v1alpha1
  group: nodeupgrade.redhat-na-ssa.github.io
  kind: MutexRunConfig
  role: mutexrunconfig
  reconcilePeriod: 10m
  manageStatus: false
  markUnsafe: true
  finalizer:
    name: nodeupgrade.redhat-na-ssa.github.io/finalizer
    vars:
      state: absent
#+kubebuilder:scaffold:watch
